version: '3.8'

services:
  db:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: clinic-db
    restart: always
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Murach@123456"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql

  backend:
    image: tomcat:10.1-jdk17
    container_name: clinic-backend
    restart: always
    depends_on:
      - db
    environment:
      DB_HOST: "db"
      DB_PORT: "1433"
      DB_NAME: "QuanLyPhongKhamDB"
    volumes:
      - ./BE_QuanLyPhongKham/target/QuanLyPhongKham-1.0-SNAPSHOT.war:/usr/local/tomcat/webapps/QuanLyPhongKham.war
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./FE_QuanLyPhongKham
      dockerfile: Dockerfile
    container_name: clinic-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mssql_data: